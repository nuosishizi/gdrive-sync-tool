name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: write
      attestations: write
      
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build Windows (Installer)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller GDriveSync.spec
        iscc installer.iss
        
    - name: Build macOS
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "GDriveSync" \
          --hidden-import "googleapiclient" \
          --collect-all "google_auth_oauthlib" \
          main.py
        cd dist
        zip -r GDriveSync-macOS.zip GDriveSync.app
        
    - name: Attest Build Provenance (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: 'dist/GDriveSync-Windows-Setup.exe'
        
    - name: Attest Build Provenance (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: 'dist/GDriveSync-macOS.zip'
        
    - name: Upload to Release (Windows)
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: dist/GDriveSync-Windows-Setup.exe
        generate_release_notes: true
        name: "GDriveSync ${{ github.ref_name }}"
        body: |
          ## 🚀 GDriveSync ${{ github.ref_name }} — Windows 版本
          
          ### 安装方法
          1. 下载 `GDriveSync-Windows-Setup.exe`
          2. 双击运行安装包，按提示完成安装
          3. 首次运行后点击「授权」，在浏览器中完成 Google 账号授权
          
          ### 更新内容
          （以下由 GitHub 自动生成）
        
    - name: Upload to Release (macOS)
      if: matrix.os == 'macos-latest'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: dist/GDriveSync-macOS.zip
        generate_release_notes: true
        name: "GDriveSync ${{ github.ref_name }}"
